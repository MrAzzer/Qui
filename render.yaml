# Render Blueprint — backend (FastAPI + WebSocket).
# Vercel nie utrzymuje połączeń WebSocket ani stanu w pamięci, więc backend stoi tutaj, a frontend na Vercelu.
services:
  - type: web
    name: qui-backend
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    # Jedna instancja: party są trzymane w pamięci procesu.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        sync: false # adres frontendu, np. https://qui-react.vercel.app
      - key: FRONTEND_URL
        sync: false # ten sam adres — trafia do join_url
      - key: LLM_API_KEY
        sync: false # klucz Groq
      - key: DATABASE_URL
        sync: false # PostgreSQL z Neon; dysk darmowego Render jest kasowany, więc SQLite tu nie przetrwa
      - key: SECRET_KEY
        generateValue: true # Render losuje klucz do podpisywania tokenów logowania
