# Render Blueprint — backend (FastAPI + WebSocket).
# Vercel nie utrzymuje połączeń WebSocket ani stanu w pamięci, więc backend stoi tutaj, a frontend na Vercelu.
services:
  - type: web
    name: qui-backend
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    # Jedna instancja: party są trzymane w pamięci procesu.
    # --ws-max-size: odrzuca ogromne ramki WebSocket już na poziomie serwera (domyślnie 16 MB)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*' --ws-max-size 65536
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        sync: false # adres frontendu, np. https://qui-react.vercel.app
      - key: FRONTEND_URL
        sync: false # ten sam adres — trafia do join_url
      - key: LLM_API_KEY
        sync: false # klucz Groq
      - key: DATABASE_URL
        sync: false # Neon PostgreSQL (adres bez -pooler); dysk darmowego Render jest kasowany, SQLite tu nie przetrwa
      - key: S3_BUCKET
        sync: false # Neon Storage: pliki materiałów, katalog users/<id>/ dla każdego użytkownika
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: us-east-2
      - key: SECRET_KEY
        generateValue: true # Render losuje klucz do podpisywania tokenów logowania
